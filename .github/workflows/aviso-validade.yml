name: Aviso de validade (Telegram)

on:
  schedule:
    - cron: '0 10 * * 1-5'   # 07:00 em Brasília, de segunda a sexta (o GitHub usa UTC)
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Enviar mesmo sem lotes urgentes'
        type: boolean
        default: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node avisos/avisar_validade.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCAR: ${{ inputs.forcar && '1' || '' }}
