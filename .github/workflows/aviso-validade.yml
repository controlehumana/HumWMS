name: Aviso de validade (Telegram)

on:
  # Sem 'schedule' desde 18/10/2026: o GitHub atrasava o disparo 3 a 5 horas e as vezes pulava a rodada.
  # O horario agora vem do cron-job.org chamando https://humwms-proxy.vercel.app/api/avisar (proxy-erp/api/avisar.js).
  # Este workflow ficou como plano B manual (botao Run workflow).
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Enviar mesmo sem lotes urgentes'
        type: boolean
        default: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node avisos/avisar_validade.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCAR: ${{ inputs.forcar && '1' || '' }}
