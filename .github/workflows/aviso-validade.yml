name: Aviso de validade (Telegram)

on:
  schedule:
    # Minutos quebrados de propósito: o GitHub atrasa muito os disparos em hora cheia (14/10: 4h44 de atraso).
    # O aviso completo sai cedo (06:23 em Brasília, UTC-3) para chegar perto das 7h.
    - cron: '23 9 * * 1-5'    # 06:23 em Brasília, seg a sex: aviso completo
    - cron: '37 16 * * 1-5'   # 13:37 em Brasília: lembrete só com os vencidos
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Enviar mesmo sem lotes urgentes'
        type: boolean
        default: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node avisos/avisar_validade.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCAR: ${{ inputs.forcar && '1' || '' }}
          MODO: ${{ github.event.schedule == '37 16 * * 1-5' && 'vencidos' || '' }}
